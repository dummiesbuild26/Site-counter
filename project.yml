# XcodeGen spec for the iOS app. Generate the project with: xcodegen generate
name: SiteCounter
options:
  bundleIdPrefix: com.sitecounter
  deploymentTarget:
    iOS: "16.0"
targets:
  SiteCounteriOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
      # Shared with the macOS app.
      - path: Sources/SiteCounter/CloudflareClient.swift
      - path: Sources/SiteCounter/Keychain.swift
      - path: Sources/SiteCounter/StatsStore.swift
      - path: Sources/SiteCounter/Formatting.swift
      - path: Sources/SiteCounter/WebAnalytics.swift
    info:
      path: Config/iOS-Info.plist
      properties:
        CFBundleDisplayName: Site Counter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: SiteCounter
        PRODUCT_BUNDLE_IDENTIFIER: com.sitecounter.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
