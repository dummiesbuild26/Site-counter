name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Launch test
        run: |
          open "build/Site Counter.app"
          sleep 20
          if pgrep -x SiteCounter >/dev/null; then
            echo "App launched and is still running."
            pkill -x SiteCounter
          else
            echo "::error::App quit during launch."
            log show --last 2m --style compact --predicate 'process == "SiteCounter"' | tail -60 || true
            for f in ~/Library/Logs/DiagnosticReports/SiteCounter*; do [ -f "$f" ] && head -150 "$f"; done
            exit 1
          fi
      - name: Zip app
        run: cd build && ditto -c -k --keepParent "Site Counter.app" SiteCounter.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SiteCounter-macOS
          path: build/SiteCounter.zip

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned IPA
        run: ./scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SiteCounter-iOS
          path: build/SiteCounter.ipa

  release:
    needs: [macos, ios]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SiteCounter.zip
            dist/SiteCounter.ipa
          generate_release_notes: true
      # Every push to the default branch also publishes a release, e.g. v1.0.7.
      - name: Publish release from default branch
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Site Counter 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/SiteCounter.zip
            dist/SiteCounter.ipa
          generate_release_notes: true
          make_latest: true
