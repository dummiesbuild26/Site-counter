name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent "Site Counter.app" SiteCounter.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SiteCounter
          path: build/SiteCounter.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/SiteCounter.zip
          generate_release_notes: true
      # Every push to the default branch also publishes a release, e.g. v1.0.7.
      - name: Publish release from default branch
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Site Counter 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: build/SiteCounter.zip
          generate_release_notes: true
          make_latest: true
